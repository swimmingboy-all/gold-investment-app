name: Daily Gold Indicators Auto-Update

on:
  schedule:
    # 매일 평일 UTC 00:30 (한국 시간 오전 9시 30분, 뉴욕 장 마감 후) 실행
    - cron: '30 0 * * 1-5'
  workflow_dispatch: # GitHub 웹에서 버튼 클릭으로 언제든 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  update-gold-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 최신 금 시세 및 거시경제 지표 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/fetch_latest_data.py

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add js/indicatorsData.js
          if git diff --staged --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "[Auto] Daily Gold Indicators & Market Data Update"
            git push
          fi
